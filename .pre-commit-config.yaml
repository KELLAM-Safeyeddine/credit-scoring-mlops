repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (creditS)
        entry: creditS/Scripts/python.exe scripts/dev.py lint
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (creditS)
        entry: creditS/Scripts/python.exe scripts/dev.py format-check
        language: system
        types: [python]

