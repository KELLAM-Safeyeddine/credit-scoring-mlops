name: credit-scoring-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Create isolated CI environment
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -r requirements.txt
          .ci-venv/bin/python -m pip check
      - name: Ruff
        run: |
          .ci-venv/bin/python -m ruff check .
          .ci-venv/bin/python -m ruff format --check .
      - name: Pytest with generated fixtures only
        run: .ci-venv/bin/python -m pytest
      - name: Build Docker API and Airflow images
        run: |
          docker build -f api/Dockerfile -t credit-scoring-api:ci .
          docker build -f airflow/Dockerfile -t credit-scoring-airflow:ci .
