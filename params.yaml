runtime:
  # Local DVC commands always use creditS. On Linux/macOS: creditS/bin/python.
  python: creditS/Scripts/python.exe
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  production: data/production
  models: models
  reports: reports
data:
  test_size: 0.2
  val_size: 0.2
  production_size: 0.2
  random_state: 42
  sample_frac: 0.1
features:
  mode: numeric_baseline
  drop_sensitive: true
  use_bureau: true
  use_previous_application: true
  use_installments: true
  # The three aggregation switches become operational in phase 3.
  sensitive_columns: [CODE_GENDER, DAYS_BIRTH, AGE_YEARS, AGE_GROUP]
train:
  model: logistic_regression
  candidate_models: [logistic_regression, random_forest, xgboost, lightgbm]
  baseline:
    C: 1.0
    max_iter: 500
  threshold:
    criterion: min_business_cost
    false_negative_cost: 10.0
    false_positive_cost: 1.0
    min: 0.01
    max: 0.99
    steps: 99
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    class_weight: balanced
    n_jobs: 4
  random_forest:
    n_estimators: 200
    max_depth: 12
    n_jobs: 4
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    n_jobs: 4
fairness:
  sensitive_features: [CODE_GENDER, AGE_GROUP]
  age_bins: [30, 45, 60]
  age_labels: ['<30', '30-45', '45-60', '60+']
  min_disparate_impact: 0.8
  max_equal_opp_diff: 0.10
  max_auc_loss_mitigation: 0.02
  positive_label: 1
  selection_definition: acceptance
quality_gate:
  min_auc: 0.74
  max_auc_drop_vs_prod: 0.005
  require_shap: true
mlflow:
  experiment_name: credit-scoring
  registered_model_name: credit-scoring
  tracking_uri: http://localhost:5000
monitoring:
  n_batches: 8
  label_delay_batches: 2
  max_drift_feature_share: 0.30
  max_score_psi: 0.20
  min_disparate_impact: 0.8
  min_auc: 0.70
  income_multiplier: 0.8
  credit_multiplier: 1.2
