runtime:
  # Local DVC commands always use creditS. On Linux/macOS: creditS/bin/python.
  python: creditS/Scripts/python.exe
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  production: data/production
  models: models
  reports: reports
  audit_reports: reports/fairness
  audit_models: artifacts/fairness_models
  shap_reports: reports/shap
data:
  test_size: 0.2
  val_size: 0.2
  production_size: 0.2
  random_state: 42
  sample_frac: 0.1
features:
  mode: engineered
  drop_sensitive: true
  use_bureau: true
  use_previous_application: true
  use_installments: true
  chunksize: 100000
  installment_partitions: 64
  history_cutoff_days: 0
  # Age-derived employment ratio is computed for audit and excluded from the model.
  sensitive_columns: [CODE_GENDER, DAYS_BIRTH, AGE_YEARS, AGE_GROUP]
train:
  candidate_models: [logistic_regression, random_forest, xgboost, lightgbm]
  baseline:
    C: 1.0
    max_iter: 500
  threshold:
    criterion: min_business_cost
    false_negative_cost: 10.0
    false_positive_cost: 1.0
    min: 0.01
    max: 0.99
    steps: 99
  lightgbm:
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 15
    class_weight: balanced
    n_jobs: 4
    min_child_samples: 100
    reg_lambda: 5.0
  random_forest:
    n_estimators: 200
    max_depth: 12
    n_jobs: 4
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    n_jobs: 4
fairness:
  sensitive_features: [CODE_GENDER, AGE_GROUP]
  age_bins: [30, 45, 60]
  age_labels: ['<30', '30-45', '45-60', '60+']
  min_disparate_impact: 0.8
  max_equal_opp_diff: 0.10
  max_auc_loss_mitigation: 0.02
  positive_label: 1
  selection_definition: acceptance
  min_group_size: 100
  min_class_count: 20
  required_groups:
    CODE_GENDER: [F, M]
    AGE_GROUP: ['<30', '30-45', '45-60', '60+']
  mitigation:
    reweighing_powers: [0.5, 1.0, 1.5, 1.75, 2.0]
    min_recall: 0.50
    min_acceptance_rate: 0.10
    max_acceptance_rate: 0.95
    calibration_size: 0.20
    reduction_eps: 0.01
    reduction_difference_bound: 0.02
    reduction_max_iter: 12
  shap_sample_size: 400
  proxy_max_features: 20
quality_gate:
  min_auc: 0.74
  max_auc_drop_vs_prod: 0.005
  require_shap: true
qualification:
  max_trials: 18
  reweighing_scopes: [[CODE_GENDER, AGE_GROUP]]
  reweighing_powers: [1.0, 1.25, 1.5]
  configurations:
    - {n_estimators: 300, num_leaves: 15, learning_rate: 0.03, min_child_samples: 100, reg_lambda: 5.0}
    - {n_estimators: 500, num_leaves: 15, learning_rate: 0.03, min_child_samples: 100, reg_lambda: 10.0}
    - {n_estimators: 300, num_leaves: 31, learning_rate: 0.03, min_child_samples: 100, reg_lambda: 10.0}
    - {n_estimators: 500, num_leaves: 31, learning_rate: 0.03, min_child_samples: 150, reg_lambda: 15.0}
    - {n_estimators: 300, num_leaves: 7, learning_rate: 0.05, min_child_samples: 80, reg_lambda: 5.0}
    - {n_estimators: 500, num_leaves: 7, learning_rate: 0.03, min_child_samples: 100, reg_lambda: 10.0}
constrained_development:
  source_params: runtime/protocol-v2/params.yaml
  output: runtime/constrained-development
  max_iter: 6
  eps: 0.01
  difference_bound: 0.02
  lightgbm: {n_estimators: 150, num_leaves: 15, learning_rate: 0.05, min_child_samples: 100, reg_lambda: 5.0, n_jobs: 4}
independent_protocol:
  id: home-credit-independent-v2
  directory: runtime/protocol-v2
  source_fraction: 0.3
  random_state: 20261003
  used_membership_roots: [data/interim, runtime/qualification-expanded-20/interim]
mlflow:
  experiment_name: credit-scoring
  registered_model_name: credit-scoring
  tracking_uri: http://localhost:5000
api:
  log_path: runtime/api/predictions.jsonl
demo:
  mode: synthetic
  threshold: 0.37
  income_multiplier: 0.60
  source_multiplier: 0.20
  model:
    n_estimators: 50
    num_leaves: 7
    min_child_samples: 80
    n_jobs: 1
monitoring:
  model_filename: candidate.pkl
  n_batches: 8
  label_delay_batches: 2
  max_drift_feature_share: 0.30
  max_score_psi: 0.20
  min_disparate_impact: 0.8
  min_auc: 0.70
  income_multiplier: 0.8
  credit_multiplier: 1.2
  young_population_share: 0.60
  targeted_group: F
  targeted_score_multiplier: 0.05
  feature_psi_threshold: 0.20
  max_missingness_delta: 0.20
  max_constant_emergence: 0.05
  critical_feature_psi: 0.10
  critical_features: [AMT_INCOME_TOTAL, AMT_CREDIT, CREDIT_INCOME_RATIO, ANNUITY_INCOME_RATIO, CREDIT_TERM, EXT_SOURCE_MEAN]
  max_population_psi: 0.20
  min_group_size: 20
  min_class_count: 5
  auc_confidence: 0.95
  auc_alert_rule: confidence_upper_below_floor
  auc_bootstrap_samples: 200
