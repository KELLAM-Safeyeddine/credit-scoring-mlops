name: credit-scoring-mlops
x-airflow-common: &airflow-common
  image: credit-scoring-airflow:2.11.0
  build:
    context: .
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:?Run scripts/start_airflow.py}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Run scripts/start_airflow.py}
    AIRFLOW__WEBSERVER__WORKERS: '2'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run scripts/start_airflow.py}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    PYTHONPATH: /workspace
    MLFLOW_TRACKING_URI: http://mlflow:5000
    CREDIT_WORKER_PYTHON: /opt/creditS/bin/python
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-credit_admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Run scripts/start_airflow.py}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/workspace/src:ro
    - ./scripts:/workspace/scripts:ro
    - ./params.yaml:/workspace/params.yaml:ro
    - ./dvc.lock:/workspace/dvc.lock:ro
    - ./data:/workspace/data:ro
    - ./models:/workspace/models:ro
    - ./runtime/airflow:/workspace/runtime/airflow
    - ./${DATA_ARCHIVE:?Run scripts/start_airflow.py}:/workspace/${DATA_ARCHIVE}:ro
    - airflow_logs:/opt/airflow/logs
  working_dir: /workspace
  depends_on:
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_healthy
services:
  postgres:
    image: postgres:14.17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/start_airflow.py}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  mlflow:
    image: credit-scoring-airflow:2.11.0
    build:
      context: .
      dockerfile: airflow/Dockerfile
    entrypoint: [/opt/creditS/bin/python, -m, mlflow]
    command: [server, --host, '0.0.0.0', --port, '5000', --workers, '1', --backend-store-uri, 'sqlite:////mlflow/tracking.db', --artifacts-destination, 'file:///mlartifacts', --serve-artifacts, --allowed-hosts, 'mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5000,127.0.0.1:5001']
    ports: ['127.0.0.1:${MLFLOW_DOCKER_PORT:-5001}:5000']
    volumes:
      - ./runtime/mlflow:/mlflow
      - ./runtime/mlartifacts:/mlartifacts
    healthcheck:
      test: [CMD, /opt/creditS/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  airflow-init:
    <<: *airflow-common
    command: [bash, -c, 'airflow db migrate && airflow users create --username "$${AIRFLOW_ADMIN_USERNAME}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Credit --lastname Admin --role Admin --email admin@example.invalid && airflow pools set credit_compute 1 "Serialize training and monitoring"']
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ['127.0.0.1:${AIRFLOW_PORT:-8081}:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 10s
      timeout: 5s
      retries: 20
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  airflow_logs:
